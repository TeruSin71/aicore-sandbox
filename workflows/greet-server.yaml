command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /app.py << 'EOF'
              from http.server import BaseHTTPRequestHandler, HTTPServer
              import json

              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(json.dumps({"status": "alive", "message": "Hello from SAP AI Core serving"}).encode())

                  def do_POST(self):
                      n = int(self.headers.get("Content-Length", 0))
                      body = self.rfile.read(n).decode() if n else "{}"
                      try:
                          data = json.loads(body)
                      except Exception:
                          data = {}
                      name = data.get("name", "stranger")
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(json.dumps({"greeting": "Hello, " + name + " - served live by SAP AI Core"}).encode())

              HTTPServer(("0.0.0.0", 9001), H).serve_forever()
              EOF
              python3 -u /app.py
