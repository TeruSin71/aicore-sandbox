apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: greet-server
  annotations:
    scenarios.ai.sap.com/name: "my-first-scenario"
    scenarios.ai.sap.com/description: "Hello world sandbox scenario"
    executables.ai.sap.com/name: "greet-server"
    executables.ai.sap.com/description: "Live REST greeting endpoint"
  labels:
    scenarios.ai.sap.com/id: "learning"
    ai.sap.com/version: "1.0"
spec:
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    metadata:
      annotations: |
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: 1
        autoscaling.knative.dev/targetBurstCapacity: 0
      labels: |
        ai.sap.com/resourcePlan: starter
    spec: |
      predictor:
        imagePullSecrets: []
        minReplicas: 1
        maxReplicas: 1
        containers:
        - name: kserve-container
          image: docker.io/python:3.11-slim
          ports:
          - containerPort: 9001
            protocol: TCP
          command: ["python3", "-u", "-c"]
          args:
            - "import json\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nclass H(BaseHTTPRequestHandler):\n    def do_GET(self):\n        self.send_response(200)\n        self.send_header('Content-Type', 'application/json')\n        self.end_headers()\n        self.wfile.write(json.dumps({'status': 'alive'}).encode())\n    def do_POST(self):\n        n = int(self.headers.get('Content-Length', 0))\n        body = self.rfile.read(n).decode() if n else '{}'\n        try:\n            data = json.loads(body)\n        except Exception:\n            data = {}\n        name = data.get('name', 'stranger')\n        self.send_response(200)\n        self.send_header('Content-Type', 'application/json')\n        self.end_headers()\n        self.wfile.write(json.dumps({'greeting': 'Hello, ' + name + ' - served live by SAP AI Core'}).encode())\nHTTPServer(('0.0.0.0', 9001), H).serve_forever()\n"
