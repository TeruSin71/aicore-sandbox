apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: greet-server
  annotations:
    scenarios.ai.sap.com/name: "my-first-scenario"
    scenarios.ai.sap.com/description: "Hello world sandbox scenario"
    executables.ai.sap.com/name: "greet-server"
    executables.ai.sap.com/description: "Live REST greeting endpoint"
  labels:
    scenarios.ai.sap.com/id: "learning"
    ai.sap.com/version: "1.0"
spec:
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    metadata:
      annotations: |
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: 1
        autoscaling.knative.dev/targetBurstCapacity: 0
      labels: |
        ai.sap.com/resourcePlan: starter
    spec: |
      predictor:
        imagePullSecrets: []
        minReplicas: 1
        maxReplicas: 1
        containers:
        - name: kserve-container
          image: docker.io/python:3.11-slim
          ports:
          - containerPort: 9001
            protocol: TCP
          command: ["/bin/sh", "-c"]
          args:
            - |
              python3 -u -c '
              from http.server import BaseHTTPRequestHandler, HTTPServer
              import json
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(json.dumps({"status": "alive", "message": "Hello from SAP AI Core serving"}).encode())
                  def do_POST(self):
                      n = int(self.headers.get("Content-Length", 0))
                      body = self.rfile.read(n).decode() if n else "{}"
                      try:
                          data = json.loads(body)
                      except Exception:
                          data = {}
                      name = data.get("name", "stranger")
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(json.dumps({"greeting": "Hello, " + name + " — served live
