apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: train-late-model
  annotations:
    scenarios.ai.sap.com/name: "late-delivery"
    scenarios.ai.sap.com/description: "Predict late goods issue for SD order items"
    executables.ai.sap.com/name: "train-late-model"
    executables.ai.sap.com/description: "Trains a RandomForest on SD order/delivery history"
    artifacts.ai.sap.com/traindata.kind: "dataset"
    artifacts.ai.sap.com/latemodel.kind: "model"
  labels:
    scenarios.ai.sap.com/id: "sd-analytics"
    ai.sap.com/version: "1.1"
spec:
  imagePullSecrets: []
  entrypoint: trainpipeline
  arguments:
    parameters:
      - name: n_estimators
        description: "Number of trees in the forest"
      - name: min_samples_leaf
        description: "Minimum samples per leaf"
  templates:
    - name: trainpipeline
      metadata:
        labels:
          ai.sap.com/resourcePlan: starter
      inputs:
        artifacts:
          - name: traindata
            path: /data
      outputs:
        artifacts:
          - name: latemodel
            globalName: latemodel
            path: /tmp/model
            archive:
              none: {}
      container:
        image: docker.io/python:3.11-slim
        env:
          - name: N_ESTIMATORS
            value: "{{workflow.parameters.n_estimators}}"
          - name: MIN_SAMPLES_LEAF
            value: "{{workflow.parameters.min_samples_leaf}}"
          - name: MODEL_DIR
            value: "/tmp/model"
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            export HOME=/tmp
            mkdir -p /tmp/model /tmp/libs
            pip install --quiet --no-cache-dir --target=/tmp/libs pandas scikit-learn joblib
            export PYTHONPATH=/tmp/libs
            python3 -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/TeruSin71/aicore-scripts/main/train.py','/tmp/train.py')"
            python3 -u /tmp/train.py
